name: Verify the NumiAgent iPhone and iPad app

on:
  pull_request:
    paths: ['ios/**', '.github/workflows/ios-ci.yml']
  push:
    branches: [main]
    paths: ['ios/**', '.github/workflows/ios-ci.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: ios
      - name: Start an iPhone simulator
        run: |
          set -euo pipefail
          device="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          phones = [device for runtime in json.load(sys.stdin)["devices"].values()
                    for device in runtime if device["name"].startswith("iPhone")]
          assert phones, "No iPhone simulator is installed"
          print(next((p for p in phones if "Pro Max" in p["name"]), phones[0])["udid"])
          ')"
          xcrun simctl boot "$device"
          echo "NUMIAGENT_SIMULATOR=$device" >> "$GITHUB_ENV"
      - name: Build the simulator app
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild -project ios/NumiAgent.xcodeproj -scheme NumiAgent -configuration Debug \
            -destination "platform=iOS Simulator,id=$NUMIAGENT_SIMULATOR" -derivedDataPath "$RUNNER_TEMP/numiagent" \
            CODE_SIGNING_ALLOWED=NO build
      - name: Build and verify the universal app
        run: |
          set -euo pipefail
          xcodebuild -project ios/NumiAgent.xcodeproj -scheme NumiAgent -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/numiagent" \
            CODE_SIGNING_ALLOWED=NO build
          python3 - "$RUNNER_TEMP/numiagent/Build/Products/Release-iphoneos/NumiAgent.app/Info.plist" <<'PY'
          import plistlib, sys
          with open(sys.argv[1], "rb") as file:
              info = plistlib.load(file)
          assert set(info["UIDeviceFamily"]) == {1, 2}, "Expected iPhone and iPad"
          assert set(info["UISupportedInterfaceOrientations~ipad"]) == {
              "UIInterfaceOrientationPortrait", "UIInterfaceOrientationPortraitUpsideDown",
              "UIInterfaceOrientationLandscapeLeft", "UIInterfaceOrientationLandscapeRight",
          }, "Expected all iPad orientations"
          assert not info.get("UIRequiresFullScreen"), "iPad windows must be resizable"
          PY
      - name: Verify the recognition benchmark runner and scorer
        run: |
          xcrun swiftc -O ios/NumiAgent/LocalRecognition.swift ios/NumiAgent/RecognitionBenchmark.swift \
            ios/benchmark/Runner.swift -o "$RUNNER_TEMP/recognition-runner"
          python3 -B -m unittest discover -s ios/benchmark -p test_score_runs.py
      - name: Prepare the iPhone simulator for visual checks
        run: |
          xcrun simctl bootstatus "$NUMIAGENT_SIMULATOR" -b
          xcrun simctl status_bar "$NUMIAGENT_SIMULATOR" override --time "9:41" --batteryLevel 100 --batteryState discharging
      - name: Verify native sign-in and saved photo actions
        run: |
          xcodebuild -project ios/NumiAgent.xcodeproj -scheme NumiAgent -configuration Debug \
            -destination "platform=iOS Simulator,id=$NUMIAGENT_SIMULATOR" -derivedDataPath "$RUNNER_TEMP/numiagent" \
            -parallel-testing-enabled NO -only-testing:NumiAgentUITests/PhoneSignInAndReviewTests \
            -only-testing:NumiAgentUITests/GuestV1Tests -resultBundlePath "$RUNNER_TEMP/numiagent-iphone.xcresult" CODE_SIGNING_ALLOWED=NO test
      - name: Export iPhone interaction screenshots
        if: always()
        run: |
          if [[ -d "$RUNNER_TEMP/numiagent-iphone.xcresult" ]]; then
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/numiagent-iphone.xcresult" --output-path "$RUNNER_TEMP/numiagent-iphone-interactions"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NumiAgent-iPhone-interactions
          path: |
            ${{ runner.temp }}/numiagent-iphone-interactions/*.png
            ${{ runner.temp }}/numiagent-iphone-interactions/manifest.json
          if-no-files-found: ignore
      - name: Collect the verified preview screens
        run: |
          python3 - <<'PY'
          import json, os, shutil
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          evidence = root / "numiagent-iphone-interactions"
          output = root / "numiagent-screenshots"
          output.mkdir(exist_ok=True)
          screens = {"sign-in", "collection", "capture", "valuation", "checklists"}
          for test in json.loads((evidence / "manifest.json").read_text()):
              for attachment in test["attachments"]:
                  name = attachment["suggestedHumanReadableName"].split("_", 1)[0]
                  if name.startswith("preview-") and name[8:] in screens:
                      shutil.copyfile(evidence / attachment["exportedFileName"], output / (name[8:] + ".png"))
          assert {p.stem for p in output.glob("*.png")} == screens, "Missing rendered preview screenshot"
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: NumiAgent-iPhone-screenshots
          path: ${{ runner.temp }}/numiagent-screenshots/*.png
          if-no-files-found: error
  ipad:
    runs-on: xcode-27
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: ios
      - name: Launch the iPad demo in landscape and portrait
        id: ipad
        run: |
          set -euo pipefail
          device="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          tablets = [device for runtime in json.load(sys.stdin)["devices"].values()
                     for device in runtime if device["name"].startswith("iPad")]
          assert tablets, "No iPad simulator is installed"
          print(next((p for p in tablets if "13-inch" in p["name"]), tablets[0])["udid"])
          ')"
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          xcrun simctl status_bar "$device" override --time "9:41" --batteryLevel 100 --batteryState discharging
          xcodebuild -project ios/NumiAgent.xcodeproj -scheme NumiAgent -configuration Debug \
            -destination "platform=iOS Simulator,id=$device" -derivedDataPath "$RUNNER_TEMP/numiagent" \
            -parallel-testing-enabled NO -only-testing:NumiAgentUITests/TabletWorkspaceTests \
            -resultBundlePath "$RUNNER_TEMP/numiagent-ipad.xcresult" CODE_SIGNING_ALLOWED=NO test
      - name: Export iPad UI test screenshots
        if: always() && steps.ipad.outcome != 'skipped'
        run: |
          result="$RUNNER_TEMP/numiagent-ipad.xcresult"
          if [[ -d "$result" ]]; then
            xcrun xcresulttool export attachments --path "$result" --output-path "$RUNNER_TEMP/numiagent-ipad-screenshots"
          fi
      - uses: actions/upload-artifact@v4
        if: always() && steps.ipad.outcome != 'skipped'
        with:
          name: NumiAgent-iPad-screenshots
          path: ${{ runner.temp }}/numiagent-ipad-screenshots/
          if-no-files-found: warn
