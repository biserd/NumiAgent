name: Verify the NumiAgent iPhone and iPad app

on:
  pull_request:
    paths: ['ios/**', '.github/workflows/ios-ci.yml']
  push:
    branches: [main]
    paths: ['ios/**', '.github/workflows/ios-ci.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: ios
      - name: Start an iPhone simulator
        run: |
          set -euo pipefail
          device="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          phones = [device for runtime in json.load(sys.stdin)["devices"].values()
                    for device in runtime if device["name"].startswith("iPhone")]
          assert phones, "No iPhone simulator is installed"
          print(next((p for p in phones if "Pro Max" in p["name"]), phones[0])["udid"])
          ')"
          xcrun simctl boot "$device"
          echo "NUMIAGENT_SIMULATOR=$device" >> "$GITHUB_ENV"
      - name: Build the simulator app
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild -project ios/NumiAgent.xcodeproj -scheme NumiAgent -configuration Debug \
            -destination "platform=iOS Simulator,id=$NUMIAGENT_SIMULATOR" -derivedDataPath "$RUNNER_TEMP/numiagent" \
            CODE_SIGNING_ALLOWED=NO build
      - name: Build and verify the universal app
        run: |
          xcodebuild -project ios/NumiAgent.xcodeproj -scheme NumiAgent -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/numiagent" \
            CODE_SIGNING_ALLOWED=NO build
          python3 - "$RUNNER_TEMP/numiagent/Build/Products/Release-iphoneos/NumiAgent.app/Info.plist" <<'PY'
          import plistlib, sys
          with open(sys.argv[1], "rb") as file:
              info = plistlib.load(file)
          assert set(info["UIDeviceFamily"]) == {1, 2}, "Expected iPhone and iPad"
          assert set(info["UISupportedInterfaceOrientations~ipad"]) == {
              "UIInterfaceOrientationPortrait", "UIInterfaceOrientationPortraitUpsideDown",
              "UIInterfaceOrientationLandscapeLeft", "UIInterfaceOrientationLandscapeRight",
          }, "Expected all iPad orientations"
          assert not info.get("UIRequiresFullScreen"), "iPad windows must be resizable"
          PY
      - name: Launch the iPhone demo and capture screenshots
        run: |
          set -euo pipefail
          device="$NUMIAGENT_SIMULATOR"
          xcrun simctl bootstatus "$device" -b
          xcrun simctl status_bar "$device" override --time "9:41" --batteryLevel 100 --batteryState discharging
          xcrun simctl install "$device" "$RUNNER_TEMP/numiagent/Build/Products/Debug-iphonesimulator/NumiAgent.app"
          mkdir -p "$RUNNER_TEMP/numiagent-screenshots"
          for view in collection capture valuation checklists; do
            launch="$(xcrun simctl launch --terminate-running-process "$device" com.numiagent.ios "--preview-$view")"
            pid="${launch##*: }"
            [[ "$pid" =~ ^[0-9]+$ ]]
            sleep 2
            kill -0 "$pid"
            xcrun simctl io "$device" screenshot "$RUNNER_TEMP/numiagent-screenshots/$view.png"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: NumiAgent-iPhone-screenshots
          path: ${{ runner.temp }}/numiagent-screenshots/*.png
          if-no-files-found: error
      - name: Launch the iPad demo in landscape and portrait
        run: |
          set -euo pipefail
          xcrun simctl shutdown "$NUMIAGENT_SIMULATOR"
          device="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          tablets = [device for runtime in json.load(sys.stdin)["devices"].values()
                     for device in runtime if device["name"].startswith("iPad")]
          assert tablets, "No iPad simulator is installed"
          print(next((p for p in tablets if "13-inch" in p["name"]), tablets[0])["udid"])
          ')"
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          xcrun simctl status_bar "$device" override --time "9:41" --batteryLevel 100 --batteryState discharging
          xcrun simctl install "$device" "$RUNNER_TEMP/numiagent/Build/Products/Debug-iphonesimulator/NumiAgent.app"
          screenshots="$RUNNER_TEMP/numiagent-ipad-screenshots"
          mkdir -p "$screenshots"

          capture() {
            local name="$1"
            shift
            local launch pid
            launch="$(xcrun simctl launch --terminate-running-process "$device" com.numiagent.ios "$@")"
            pid="${launch##*: }"
            [[ "$pid" =~ ^[0-9]+$ ]]
            sleep 4
            kill -0 "$pid"
            xcrun simctl io "$device" screenshot "$screenshots/$name.png"
          }

          capture collection-portrait --preview-collection
          for view in collection capture valuation checklists; do
            capture "$view-landscape" "--preview-$view" --tablet-landscape
          done
          python3 - "$screenshots" <<'PY'
          from pathlib import Path
          import struct, sys
          for screenshot in Path(sys.argv[1]).glob("*.png"):
              png = screenshot.read_bytes()
              assert png[:8] == b"\x89PNG\r\n\x1a\n", screenshot.name
              width, height = struct.unpack(">II", png[16:24])
              assert (width > height) == screenshot.stem.endswith("-landscape"), (screenshot.name, width, height)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: NumiAgent-iPad-screenshots
          path: ${{ runner.temp }}/numiagent-ipad-screenshots/*.png
          if-no-files-found: error
