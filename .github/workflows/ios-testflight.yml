name: Upload NumiAgent to TestFlight

on:
  workflow_dispatch:
    inputs:
      guest_backend:
        description: Guest photo search backend
        type: choice
        default: production
        options: [production, staging]

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer

concurrency:
  group: numiagent-testflight
  cancel-in-progress: false

jobs:
  upload:
    if: github.ref == 'refs/heads/main'
    runs-on: xcode-27
    environment: app-store
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            ios
            .github/scripts
      - name: Verify the live photo-only identification regression
        env:
          GUEST_BACKEND: ${{ inputs.guest_backend }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from urllib.error import HTTPError
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          audience = "https://numiagent.com/photo-identification-release"
          oidc_url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&" + urlencode({"audience": audience})
          identity_request = Request(oidc_url, headers={
              "Authorization": "Bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]
          })
          with urlopen(identity_request, timeout=20) as identity:
              token = json.load(identity)["value"]
          check = Request("https://numiagent.com/api/v1/internal/photo-release", method="POST", headers={
              "Authorization": "Bearer " + token,
              "User-Agent": "NumiAgent-release-verification/1.0",
              "Accept": "application/json",
          })
          try:
              with urlopen(check, timeout=110) as response:
                  result = json.load(response)
          except HTTPError as error:
              try:
                  reason = json.loads(error.read(2048)).get("error", "")
              except (ValueError, AttributeError):
                  reason = "Unexpected response from the production site"
              raise SystemExit(f"Photo regression check returned HTTP {error.code}. {reason}")
          if result.get("fixture") != "faustina-two-sided-v1" or result.get("passed") is not True:
              raise SystemExit(f"Photo identification regression failed: {result}")
          print("Both original photos identified Faustina II and the denarius denomination; the exact variant stayed open.")

          guest_origin = "https://staging.numiagent.com" if os.environ["GUEST_BACKEND"] == "staging" else "https://numiagent.com"
          guest_check = Request(guest_origin + "/api/v1/guest-scans/testflight-readiness", method="POST",
                                headers={
                                    "Origin": guest_origin,
                                    "User-Agent": "NumiAgent-release-verification/1.0",
                                    "Accept": "application/json",
                                })
          try:
              with urlopen(guest_check, timeout=20):
                  raise SystemExit("The guest photo endpoint accepted an invalid scan ID")
          except HTTPError as error:
              if error.code != 400:
                  raise SystemExit(f"The guest photo endpoint at {guest_origin} returned HTTP {error.code}")
              try:
                  result = json.loads(error.read(2048))
              except ValueError:
                  raise SystemExit(f"The guest photo endpoint at {guest_origin} returned an invalid response")
              if result.get("error") != "Invalid scan ID or device clock":
                  raise SystemExit(f"The guest photo endpoint at {guest_origin} returned an unexpected validation result")
          print("Guest photo endpoint verified at " + guest_origin)
          PY
      - name: Verify native guest photo consent before signing
        run: |
          set -euo pipefail
          xcodebuild -version
          simulator_sdk="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          simulator="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          runtime = "com.apple.CoreSimulator.SimRuntime.iOS-" + sys.argv[1].replace(".", "-")
          phones = [d for d in json.load(sys.stdin)["devices"].get(runtime, []) if d["name"].startswith("iPhone")]
          assert phones, "No iPhone simulator is installed for the selected SDK"
          print(next((d for d in phones if "Pro Max" in d["name"]), phones[0])["udid"])
          ' "$simulator_sdk")"
          xcrun simctl boot "$simulator"
          xcodebuild -project ios/NumiAgent.xcodeproj -scheme NumiAgent -configuration Debug \
            -destination "platform=iOS Simulator,id=$simulator" -derivedDataPath "$RUNNER_TEMP/numiagent-consent" \
            -parallel-testing-enabled NO -test-iterations 3 \
            -only-testing:NumiAgentUITests/GuestV1Tests/testGuestSearchUsesInlineConsentAndFillsRecord \
            CODE_SIGNING_ALLOWED=NO test
      - name: Archive, sign, and upload
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          IOS_BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
          GUEST_BACKEND: ${{ inputs.guest_backend }}
        run: |
          set -euo pipefail
          : "${IOS_CERTIFICATE_BASE64:?Configure IOS_CERTIFICATE_BASE64 in the app-store environment}"
          : "${IOS_CERTIFICATE_PASSWORD:?Configure IOS_CERTIFICATE_PASSWORD in the app-store environment}"
          : "${IOS_PROFILE_BASE64:?Configure IOS_PROFILE_BASE64 in the app-store environment}"
          : "${ASC_KEY_ID:?Configure ASC_KEY_ID in the app-store environment}"
          : "${ASC_ISSUER_ID:?Configure ASC_ISSUER_ID in the app-store environment}"
          : "${ASC_PRIVATE_KEY:?Configure ASC_PRIVATE_KEY in the app-store environment}"
          [[ "$ASC_KEY_ID" =~ ^[A-Z0-9]{10}$ ]]
          [[ "$ASC_ISSUER_ID" =~ ^[0-9a-fA-F-]{36}$ ]]
          umask 077
          signing="$(mktemp -d "$RUNNER_TEMP/numiagent-signing.XXXXXX")"
          keychain="$signing/distribution.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          printf '%s' "$IOS_CERTIFICATE_BASE64" | base64 -D > "$signing/distribution.p12"
          printf '%s' "$IOS_PROFILE_BASE64" | base64 -D > "$signing/NumiAgent.mobileprovision"
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$signing/AuthKey_$ASC_KEY_ID.p8"
          security cms -D -i "$signing/NumiAgent.mobileprovision" > "$signing/profile.plist"
          app_id="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$signing/profile.plist")"
          [[ "$app_id" == 'DB5JRGGB6A.com.numiagent.ios' ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:get-task-allow' "$signing/profile.plist")" == 'false' ]]
          profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$signing/profile.plist")"
          [[ "$profile_uuid" =~ ^[0-9a-fA-F-]{36}$ ]]
          profiles="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$profiles"
          cp "$signing/NumiAgent.mobileprovision" "$profiles/$profile_uuid.mobileprovision"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$signing/distribution.p12" -k "$keychain" -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain"
          build_settings=(CURRENT_PROJECT_VERSION="$IOS_BUILD_NUMBER")
          if [[ "$GUEST_BACKEND" == "staging" ]]; then
            build_settings+=(SWIFT_ACTIVE_COMPILATION_CONDITIONS=NUMIAGENT_TESTFLIGHT_STAGING)
          fi
          xcodebuild -project ios/NumiAgent.xcodeproj -scheme NumiAgent -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/NumiAgent.xcarchive" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY='Apple Distribution' PROVISIONING_PROFILE_SPECIFIER="$profile_uuid" \
            "${build_settings[@]}" archive
          python3 - "$RUNNER_TEMP/NumiAgent.xcarchive/Products/Applications/NumiAgent.app/Info.plist" <<'PY'
          import plistlib, sys
          with open(sys.argv[1], "rb") as file:
              info = plistlib.load(file)
          sdk = info["DTSDKName"]
          minimum = info["MinimumOSVersion"]
          assert sdk.startswith("iphoneos27."), f"Unexpected release SDK: {sdk}"
          assert minimum == "17.0", f"Unexpected minimum iOS version: {minimum}"
          assert set(info["UIDeviceFamily"]) == {1, 2}, "Expected iPhone and iPad support"
          assert "UILaunchScreen" in info, "Missing the launch screen required for the iOS 27 SDK"
          print(f"Verified {sdk} release archive with iOS {minimum} minimum and iPhone/iPad support.")
          PY
          python3 - "$signing/ExportOptions.plist" "$profile_uuid" <<'PY'
          import plistlib, sys
          with open(sys.argv[1], "wb") as file:
              plistlib.dump({
                  "method": "app-store-connect",
                  "destination": "upload",
                  "signingStyle": "manual",
                  "teamID": "DB5JRGGB6A",
                  "signingCertificate": "Apple Distribution",
                  "provisioningProfiles": {"com.numiagent.ios": sys.argv[2]},
                  "manageAppVersionAndBuildNumber": False,
              }, file)
          PY
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/NumiAgent.xcarchive" \
            -exportOptionsPlist "$signing/ExportOptions.plist" -exportPath "$RUNNER_TEMP/numiagent-export" \
            -allowProvisioningUpdates -authenticationKeyPath "$signing/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - name: Make the processed build available to internal testers
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          IOS_BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
        run: node .github/scripts/distribute-testflight.mjs
