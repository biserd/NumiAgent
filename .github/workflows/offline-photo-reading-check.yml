name: Verify bundled coin and banknote catalog offline

on:
  push:
    branches: [codex/offline-photo-reading-check]

permissions:
  contents: read

jobs:
  standalone:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            ios/NumiAgent
            ios/NumiAgent.xcodeproj
            benchmarks/offline-reading
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare the public smoke-test photo and the macOS test bundle
        run: |
          plutil -lint -- ios/NumiAgent.xcodeproj/project.pbxproj
          xcrun --sdk macosx swiftc -frontend -parse ios/NumiAgent/{LocalRecognition,GuestWorkspace,CaptureScreen}.swift
          app="$RUNNER_TEMP/OfflineCatalogCheck.app/Contents"
          mkdir -p "$app/MacOS" "$app/Resources"
          cp -R ios/NumiAgent/OfflineCatalog ios/NumiAgent/LocalCatalog.json "$app/Resources/"
          cat > "$app/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <plist version="1.0"><dict>
          <key>CFBundleIdentifier</key><string>com.numiagent.offline-catalog-check</string>
          <key>CFBundleExecutable</key><string>check-offline-reading</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          </dict></plist>
          PLIST
          xcrun --sdk macosx swiftc -O ios/NumiAgent/LocalRecognition.swift \
            benchmarks/offline-reading/Check.swift -o "$app/MacOS/check-offline-reading"
          curl --fail --silent --show-error --location --retry 2 \
            'https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a1/US-%241-SC-1923-Fr.237.jpg/960px-US-%241-SC-1923-Fr.237.jpg' \
            --output "$RUNNER_TEMP/silver-certificate.jpg"
          python -m pip install pillow==13.0.0
          python - <<'PY'
          import os
          from pathlib import Path
          from PIL import Image

          folder = Path(os.environ["RUNNER_TEMP"])
          with Image.open(folder / "silver-certificate.jpg") as source:
              width, height = source.size
              split = int(height * 0.5)
              source.crop((0, 0, width, split)).convert("RGB").save(folder / "silver-obverse.jpg")
              source.crop((0, split, width, height)).convert("RGB").save(folder / "silver-reverse.jpg")
          PY
      - name: Deny network access and scan both specimens
        run: |
          python - <<'PY'
          import os
          import subprocess
          import threading
          from http.server import BaseHTTPRequestHandler, HTTPServer
          from pathlib import Path

          class Probe(BaseHTTPRequestHandler):
              def do_GET(self):
                  self.send_response(204)
                  self.end_headers()

          with HTTPServer(("127.0.0.1", 0), Probe) as server:
              threading.Thread(target=server.serve_forever, daemon=True).start()
              url = f"http://127.0.0.1:{server.server_port}/probe"
              curl = ["/usr/bin/curl", "--noproxy", "*", "--fail", "--silent", "--show-error", "--max-time", "5", url]
              subprocess.run(curl, check=True)
              sandbox = ["/usr/bin/sandbox-exec", "-p", "(version 1) (allow default) (deny network*)"]
              denied = subprocess.run(sandbox + curl, capture_output=True, text=True)
              if denied.returncode != 7:
                  raise SystemExit(f"Expected the sandbox to deny the working socket. Got: {denied.returncode} {denied.stderr}")
              print("Confirmed network denial against the working loopback probe", flush=True)
              folder = Path(os.environ["RUNNER_TEMP"])
              subprocess.run(sandbox + [str(folder / "OfflineCatalogCheck.app/Contents/MacOS/check-offline-reading"),
                  "ios/NumiAgent/Assets.xcassets/DemoNickel.imageset/jefferson-nickel.jpg",
                  str(folder / "silver-obverse.jpg"), str(folder / "silver-reverse.jpg")], check=True)
              server.shutdown()
          PY
