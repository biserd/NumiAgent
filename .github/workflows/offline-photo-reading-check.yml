name: Verify bundled coin and banknote catalog offline

on:
  push:
    branches: [codex/offline-photo-reading-check]

permissions:
  contents: read

jobs:
  standalone:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            ios/NumiAgent
            ios/NumiAgent.xcodeproj
            benchmarks/offline-reading
      - name: Prepare the public smoke-test photo and the macOS test bundle
        run: |
          plutil -lint -- ios/NumiAgent.xcodeproj/project.pbxproj
          xcrun --sdk macosx swiftc -frontend -parse ios/NumiAgent/{LocalRecognition,GuestWorkspace,CaptureScreen}.swift
          app="$RUNNER_TEMP/OfflineCatalogCheck.app/Contents"
          mkdir -p "$app/MacOS" "$app/Resources"
          cp -R ios/NumiAgent/OfflineCatalog ios/NumiAgent/LocalCatalog.json "$app/Resources/"
          cat > "$app/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <plist version="1.0"><dict>
          <key>CFBundleIdentifier</key><string>com.numiagent.offline-catalog-check</string>
          <key>CFBundleExecutable</key><string>check-offline-reading</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          </dict></plist>
          PLIST
          xcrun --sdk macosx swiftc -O ios/NumiAgent/LocalRecognition.swift \
            benchmarks/offline-reading/Check.swift -o "$app/MacOS/check-offline-reading"
          curl --fail --silent --show-error --location --retry 2 \
            'https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a1/US-%241-SC-1923-Fr.237.jpg/960px-US-%241-SC-1923-Fr.237.jpg' \
            --output "$RUNNER_TEMP/silver-certificate.jpg"
      - name: Deny network access and scan both specimens
        run: |
          python3 -m http.server 19724 --bind 127.0.0.1 --directory "$RUNNER_TEMP" > "$RUNNER_TEMP/loopback.log" 2>&1 &
          trap 'kill "$!"' EXIT
          probe='http://127.0.0.1:19724/silver-certificate.jpg'
          curl --fail --silent --retry 3 --retry-connrefused --max-time 4 "$probe" --output /dev/null
          profile='(version 1) (allow default) (deny network*)'
          if sandbox-exec -p "$profile" /usr/bin/curl --fail --silent --max-time 3 "$probe" --output /dev/null; then
            echo 'Expected sandbox to block a confirmed working network connection'
            exit 1
          fi
          echo 'Confirmed network denial against the working loopback probe'
          sandbox-exec -p "$profile" "$RUNNER_TEMP/OfflineCatalogCheck.app/Contents/MacOS/check-offline-reading" \
            ios/NumiAgent/Assets.xcassets/DemoNickel.imageset/jefferson-nickel.jpg \
            "$RUNNER_TEMP/silver-certificate.jpg"
