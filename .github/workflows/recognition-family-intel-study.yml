name: Run the coin-family holdout on the alternate hosted Mac pool

on:
  push:
    branches: [codex/recognition-family-study]
    paths:
      - .github/workflows/recognition-family-intel-study.yml

permissions:
  contents: read

jobs:
  fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pillow==13.0.0
      - run: |
          python -u benchmarks/public-model-study/materialize.py "$RUNNER_TEMP/fixture" \
            --manifest benchmarks/public-model-study/family-inputs.json
      - name: Export the fixed Core ML package
        env:
          HF_HUB_DISABLE_XET: '1'
        run: |
          python -m pip install torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r ios/benchmark/requirements.txt
          python ios/benchmark/convert_models.py "$RUNNER_TEMP/fixture" dinov2-small
      - uses: actions/upload-artifact@v4
        with:
          name: family-fixture-and-coreml-package
          path: ${{ runner.temp }}/fixture/
          retention-days: 3
          if-no-files-found: error

  score:
    needs: fixture
    runs-on: macos-26-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: family-fixture-and-coreml-package
          path: ${{ runner.temp }}/fixture
      - name: Compile and run the standalone macOS recognition CLI
        run: |
          suite="$RUNNER_TEMP/fixture"
          reports="$RUNNER_TEMP/reports"
          mkdir -p "$reports"
          xcrun coremlcompiler compile "$suite/dinov2-small.mlpackage" "$suite"
          xcrun swiftc -O ios/NumiAgent/LocalRecognition.swift ios/NumiAgent/RecognitionBenchmark.swift \
            ios/benchmark/Runner.swift -o "$RUNNER_TEMP/recognition-runner"
          "$RUNNER_TEMP/recognition-runner" "$suite" dinov2-small "$reports/dinov2-small-report.json"
          cp "$suite/"{catalog,manifest,source-sha256}.json "$reports/"
      - name: Verify replay agreement and score the fresh holdout
        run: |
          reports="$RUNNER_TEMP/reports"
          python3 benchmarks/public-model-study/score_coin_family.py evaluate "$reports/dinov2-small-report.json" \
            "$reports/source-sha256.json" benchmarks/public-model-study/family-inputs.json \
            benchmarks/public-model-study/family-policy.json "$reports/coin-family-results.json" --replay-compatible-runtime
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coin-family-study-results-intel
          path: ${{ runner.temp }}/reports/
          retention-days: 30
          if-no-files-found: error
