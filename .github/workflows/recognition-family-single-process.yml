name: Verify the coin-family rule in one Mac process

on:
  push:
    branches: [codex/recognition-family-study]
    paths:
      - .github/workflows/recognition-family-single-process.yml

permissions:
  actions: read
  contents: read

jobs:
  family:
    runs-on: macos-26-intel
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: family-fixture-and-coreml-package
          path: ${{ runner.temp }}/model
          run-id: '44311255464'
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: possible-matches-study-results
          path: ${{ runner.temp }}/previous
          run-id: '44300337881'
          github-token: ${{ github.token }}
      - name: Prepare the disjoint coin splits
        run: |
          python -m pip install pillow==13.0.0
          python benchmarks/public-model-study/family_single_process.py prepare "$RUNNER_TEMP/reports"
          python -u benchmarks/public-model-study/materialize.py "$RUNNER_TEMP/fixture" \
            --manifest "$RUNNER_TEMP/reports/combined-inputs.json"
      - name: Process the coins with one macOS CLI instance
        run: |
          suite="$RUNNER_TEMP/fixture"
          xcrun coremlcompiler compile "$RUNNER_TEMP/model/dinov2-small.mlpackage" "$suite"
          xcrun swiftc -O ios/NumiAgent/LocalRecognition.swift ios/NumiAgent/RecognitionBenchmark.swift \
            ios/benchmark/Runner.swift -o "$RUNNER_TEMP/recognition-runner"
          "$RUNNER_TEMP/recognition-runner" "$suite" dinov2-small "$RUNNER_TEMP/reports/combined-dinov2-small.json"
          cp "$suite/"{catalog,manifest,source-sha256}.json "$RUNNER_TEMP/reports/"
      - name: Fit on earlier coins and report the separate holdout
        run: |
          python benchmarks/public-model-study/family_single_process.py score "$RUNNER_TEMP/reports" \
            "$RUNNER_TEMP/reports/source-sha256.json" "$RUNNER_TEMP/previous/possible-matches.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coin-family-final-results
          path: ${{ runner.temp }}/reports/
          retention-days: 30
          if-no-files-found: error
