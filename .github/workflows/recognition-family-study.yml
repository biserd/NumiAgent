name: Verify DINOv2-Small coin family fallback on fresh specimens

on:
  push:
    branches: [codex/recognition-family-study]
    paths:
      - .github/workflows/recognition-family-study.yml
      - benchmarks/public-model-study/family-inputs.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  family:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Materialize the frozen coin fixture
        run: |
          python -m pip install pillow==13.0.0
          python -u benchmarks/public-model-study/materialize.py "$RUNNER_TEMP/fixture" \
            --manifest benchmarks/public-model-study/family-inputs.json
      - name: Convert DINOv2-Small at the benchmark input size
        env:
          HF_HUB_DISABLE_XET: '1'
        run: |
          suite="$RUNNER_TEMP/fixture"
          python -m pip install -r ios/benchmark/requirements.txt
          python ios/benchmark/convert_models.py "$suite" dinov2-small
          xcrun coremlcompiler compile "$suite/dinov2-small.mlpackage" "$suite"
      - name: Compile and run the standalone macOS recognition CLI
        run: |
          suite="$RUNNER_TEMP/fixture"
          reports="$RUNNER_TEMP/reports"
          mkdir -p "$reports"
          xcrun swiftc -O ios/NumiAgent/LocalRecognition.swift ios/NumiAgent/RecognitionBenchmark.swift \
            ios/benchmark/Runner.swift -o "$RUNNER_TEMP/recognition-runner"
          "$RUNNER_TEMP/recognition-runner" "$suite" dinov2-small "$reports/dinov2-small-report.json"
          cp "$suite/"{catalog,manifest,source-sha256}.json "$reports/"
      - name: Score the fresh holdout with the frozen policy
        run: |
          reports="$RUNNER_TEMP/reports"
          python benchmarks/public-model-study/score_coin_family.py evaluate "$reports/dinov2-small-report.json" \
            "$reports/source-sha256.json" benchmarks/public-model-study/family-inputs.json \
            benchmarks/public-model-study/family-policy.json "$reports/coin-family-results.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coin-family-study-results
          path: ${{ runner.temp }}/reports/
          retention-days: 30
          if-no-files-found: error
