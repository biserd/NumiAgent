name: Verify swipe on a compact iPhone with XcodeBuildMCP
on:
  push:
    branches: [codex/verify-swipe-simulator]
permissions:
  contents: read
jobs:
  simulator:
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      XCODEBUILDMCP_ENABLED_WORKFLOWS: simulator,ui-automation,session-management
      SENTRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: ios
          persist-credentials: false
      - name: Start a compact iPhone
        run: |
          set -euo pipefail
          device="$(xcrun simctl list devices available -j | python3 -c '
          import sys,json
          phones=[d for ds in json.load(sys.stdin)["devices"].values() for d in ds if d["name"].startswith("iPhone")]
          phone=next((p for p in phones if p["name"].endswith("e")),next((p for p in phones if "Max" not in p["name"] and "Plus" not in p["name"]),phones[0]))
          print(phone["name"],file=sys.stderr)
          print(phone["udid"])')"
          xcrun simctl boot "$device"
          echo "DEVICE=$device" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/swipe-evidence"
          npm install --prefix "$RUNNER_TEMP/numi-tools" --no-audit --no-fund xcodebuildmcp@2.7.0
          echo "$RUNNER_TEMP/numi-tools/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Install and open a disposable gallery
        run: |
          set -euo pipefail
          xcodebuild -quiet -project ios/NumiAgent.xcodeproj -scheme NumiAgent -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath "$RUNNER_TEMP/swipe-build" CODE_SIGNING_ALLOWED=NO build
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" "$RUNNER_TEMP/swipe-build/Build/Products/Debug-iphonesimulator/NumiAgent.app"
          xcrun simctl launch "$DEVICE" com.numiagent.ios "--guest-test-$(uuidgen)" --guest-sales-fixture -collector-list-view NO
          sleep 3
          for mode in light dark; do
            xcrun simctl ui "$DEVICE" appearance "$mode"
            sleep 2
            xcrun simctl io "$DEVICE" screenshot "$RUNNER_TEMP/swipe-evidence/gallery-$mode.png"
          done
      - name: Inspect accessible gallery labels with XcodeBuildMCP
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee "$RUNNER_TEMP/swipe-evidence/gallery.txt"
          import json, os, subprocess, time
          server = subprocess.Popen(["xcodebuildmcp", "mcp"], stdin=subprocess.PIPE, stdout=subprocess.PIPE, text=True)
          def send(method, payload, number=None):
              request = dict(jsonrpc="2.0", method=method, params=payload)
              if number is not None: request["id"] = number
              server.stdin.write(json.dumps(request) + "\n")
              server.stdin.flush()
              if number is None: return
              for line in server.stdout:
                  response = json.loads(line)
                  if response.get("id") == number:
                      if "error" in response: raise RuntimeError(response["error"])
                      return response["result"]
              raise RuntimeError("XcodeBuildMCP exited before responding")
          try:
              send("initialize", {"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"numi-swipe-verification","version":"1"}}, 1)
              send("notifications/initialized", {})
              tools = {t["name"]:t for t in send("tools/list", {}, 2)["tools"]}
              snapshot = next(n for n in tools if n in ("snapshot_ui","describe_ui"))
              def call(name, args, i):
                  return send("tools/call", {"name": name, "arguments":args}, i)
              default = next((n for n in tools if n in ("session_set_defaults","session-set-defaults")),None)
              if default:
                  print(json.dumps(call(default, {"simulatorId":os.environ["DEVICE"]}, 3)), flush=True)
              props = tools[snapshot]["inputSchema"].get("properties", {})
              args = {"simulatorId":os.environ["DEVICE"]} if "simulatorId" in props or not default else {}
              for i in range(4,7):
                  result = json.dumps(call(snapshot, args, i), ensure_ascii=False)
                  print(result, flush=True)
                  if "United States quarter" in result or "gallery-piece-" in result: break
                  time.sleep(2)
              else: raise RuntimeError("Quarter missing from the runtime accessibility tree")
          finally:
              server.terminate()
          PY
      - name: Exercise both swipe flows and the system Reduce Motion setting using XcodeBuildMCP
        if: always() && env.DEVICE != ''
        run: |
          set -euo pipefail
          params="$(python3 -c '
          import json, os
          print(json.dumps(dict(projectPath=os.path.abspath("ios/NumiAgent.xcodeproj"),scheme="NumiAgent",simulatorId=os.environ["DEVICE"],derivedDataPath=os.environ["RUNNER_TEMP"]+"/swipe-build",extraArgs=["-parallel-testing-enabled","NO","-only-testing:NumiAgentUITests/GuestV1Tests/testSwipeGalleryCardCancelsThenDeletesOnlyThatPiece","-only-testing:NumiAgentUITests/GuestV1Tests/testSwipeListRowWithAccessibilityText","-only-testing:NumiAgentUITests/GuestV1Tests/testGallerySwipeWithSystemReduceMotionEnabled","CODE_SIGNING_ALLOWED=NO"])))' )"
          xcodebuildmcp simulator test --json "$params" | tee "$RUNNER_TEMP/swipe-evidence/tests.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compact-iphone-swipe-evidence
          path: ${{ runner.temp }}/swipe-evidence
