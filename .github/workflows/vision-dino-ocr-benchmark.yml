name: Read benchmark coins with Apple Vision

on:
  push:
    branches: [codex/vision-dino-ocr-benchmark]
    paths:
      - .github/workflows/vision-dino-ocr-benchmark.yml
      - benchmarks/vision-dino/**

permissions:
  contents: read

jobs:
  ocr:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare the exact pinned specimen photos
        run: |
          python -m pip install pillow==13.0.0
          python -u benchmarks/public-model-study/materialize.py "$RUNNER_TEMP/fixture" \
            --manifest benchmarks/vision-dino/roman-inputs.json
      - name: Run the existing Vision OCR with a macOS command-line executable
        run: |
          xcrun --sdk macosx swiftc -O ios/NumiAgent/LocalRecognition.swift \
            benchmarks/vision-dino/OCRRunner.swift -o "$RUNNER_TEMP/vision-ocr"
          "$RUNNER_TEMP/vision-ocr" "$RUNNER_TEMP/fixture" "$RUNNER_TEMP/apple-ocr.json"
      - uses: actions/upload-artifact@v4
        with:
          name: apple-vision-coin-evidence
          path: ${{ runner.temp }}/apple-ocr.json
          retention-days: 30
          if-no-files-found: error
